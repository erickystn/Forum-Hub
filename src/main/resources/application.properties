spring.application.name=forumhub
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/forumhub_api
spring.datasource.username=root
spring.datasource.password=root
server.error.include-stacktrace=never
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.default-sort-by=nome
spring.data.web.sort.sort-parameter=sort
spring.data.web.pageable.max-page-size=50
api.security.token.secret=${API_SECRET:12345678}
api.security.token.expiration-hour=2
